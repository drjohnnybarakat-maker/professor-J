/* ---------------- Storage (localStorage — independent per device, with in-memory fallback) ----------------

const memCache = {};
let storageAvailable = true;
try{ localStorage.setItem('__pj_test__','1'); localStorage.removeItem('__pj_test__'); }
catch(e){ storageAvailable = false; }

function getStore(key, fallback){
  if(key in memCache) return memCache[key];
  if(storageAvailable){
    try{
      const v = localStorage.getItem(key);
      if(v){ const parsed = JSON.parse(v); memCache[key] = parsed; return parsed; }
    }catch(e){ /* corrupted or inaccessible — fall through to fallback */ }
  }
  memCache[key] = fallback;
  return fallback;
}
function setStore(key, value){
  memCache[key] = value;
  if(!storageAvailable) return;
  try{ localStorage.setItem(key, JSON.stringify(value)); }
  catch(e){ /* quota or access error — memCache still holds the value for this session */ }
}

/* ---------------- Navigation history (Back / Home) ---------------- */
let navStack = [];
function snapshotState(){
  return { currentId: state.currentId, tab: state.tab };
}
function pushNav(){ navStack.push(snapshotState()); updateNavButtons(); }
function goBack(){
  const prev = navStack.pop();
  if(!prev){ updateNavButtons(); return; }
  state.currentId = prev.currentId; state.tab = prev.tab;
  if(state.currentId && state.profiles.find(p=>p.id===state.currentId)) renderDashboard();
  else renderProfileSelect();
  updateNavButtons();
}
function goHome(){
  navStack = [];
  state.currentId = null;
  renderProfileSelect();
  updateNavButtons();
}
function updateNavButtons(){
  const backBtn = document.getElementById('backBtn');
  const homeBtn = document.getElementById('homeBtn');
  backBtn.style.display = navStack.length ? 'flex' : 'none';
  homeBtn.style.display = state.currentId ? 'flex' : 'none';
}
document.getElementById('backBtn').onclick = goBack;
document.getElementById('homeBtn').onclick = goHome;

function init(){
  state.profiles = getStore('profiles', null);
  if(!state.profiles){ state.profiles = DEFAULT_PROFILES; setStore('profiles', state.profiles); }
  state.currentId = getStore('lastProfile', null);
  if(state.currentId && state.profiles.find(p=>p.id===state.currentId)){ renderDashboard(); }
  else { renderProfileSelect(); }
}
function currentProfile(){ return state.profiles.find(p=>p.id===state.currentId); }

/* ---------------- Gemini API (BYOK — free tier, key stored locally on this device only) ---------------- */
async function callClaude(system, messages){
  const apiKey = getStore('apiKey', '');
  if(!apiKey) throw new Error('NO_KEY');
  const contents = messages.map(m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] }));
  const response = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: system }] },
        contents: contents,
        generationConfig: { maxOutputTokens: 1200 }
      })
    }
  );
  const data = await response.json();
  if(data.error) throw new Error(data.error.message || 'API_ERROR');
  const text = (data.candidates?.[0]?.content?.parts || []).map(b=>b.text||'').join('\\n');
  return text;
}
function stripJsonFences(t){ return t.replace(/```json/gi,'').replace(/```/g,'').trim(); }

/* ---------------- Voice: speak (TTS) ---------------- */
let currentUtterance = null;
function speakText(text, btn){
  if(!('speechSynthesis' in window)) return;
  if(speechSynthesis.speaking){ speechSynthesis.cancel(); if(btn) btn.textContent = '🔊'; if(currentUtterance && currentUtterance._btn===btn) { currentUtterance=null; return; } }
  const clean = text.replace(/[*_#`]/g, '');
  const u = new SpeechSynthesisUtterance(clean);
  u._btn = btn;
  u.onstart = ()=>{ if(btn) btn.textContent = '⏸'; };
  u.onend = ()=>{ if(btn) btn.textContent = '🔊'; };
  u.onerror = ()=>{ if(btn) btn.textContent = '🔊'; };
  currentUtterance = u;
  speechSynthesis.speak(u);
}

/* ---------------- Voice: listen (STT) ----------------
   Note: Apple's WebKit does not run the Web Speech recognition API once a page is installed
   as a Home Screen app (a known Safari/PWA limitation, not something fixable from app code).
   Mic input works when Professor J is opened as a normal Safari tab; when launched from the
   Home Screen icon, only text input and read-aloud replies are available. We detect this and
   tell the student plainly rather than showing a silently broken mic button. */
function getSpeechRecognition(){
  return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}
function isStandalonePWA(){
  return window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
}
function setupMic(inputEl, micBtn){
  const SR = getSpeechRecognition();
  if(!SR || isStandalonePWA()){
    micBtn.style.opacity = '0.35';
    micBtn.onclick = ()=>{
      alert(!SR ? "Voice input isn't supported in this browser." :
        "Voice input only works when Professor J is open in a regular Safari tab — Apple disables microphone speech recognition for apps installed to the Home Screen. Text input and spoken replies still work fully here.");
    };
    return;
  }
  let recognizing = false;
  const rec = new SR();
  rec.continuous = false; rec.interimResults = false; rec.lang = 'en-US';
  rec.onresult = (e)=>{ inputEl.value = e.results[0][0].transcript; };
  rec.onend = ()=>{ recognizing = false; micBtn.classList.remove('mic-active'); };
  rec.onerror = ()=>{ recognizing = false; micBtn.classList.remove('mic-active'); };
  micBtn.onclick = ()=>{
    if(recognizing){ rec.stop(); return; }
    try{ rec.start(); recognizing = true; micBtn.classList.add('mic-active'); }catch(e){}
  };
}

      const div = document.createElement('div'); div.className='bubble '+m.role;
      if(m.role==='assistant'){

        div.appendChild(speakBtn); div.appendChild(txt);
      } else { div.textContent = m.content; }
      log.appendChild(div);
    });
    log.scrollTop = log.scrollHeight;
  }
  async function sendExplain(){
    const input = document.getElementById('expInput'); const q = input.value.trim(); if(!q) return;
    const subject = p.subjects[subjSel.value]?.name || ''; const topic = document.getElementById('expTopic').value;
    explainHistory.push({role:'user', content:q}); renderChatLog(); input.value = '';
    const log = document.getElementById('chatLog');
    const typing = document.createElement('div'); typing.className='typing'; typing.textContent='Professor J is thinking...'; log.appendChild(typing);
    const system = `You are Professor J — an experienced, warm, and slightly witty medical school professor and personal mentor, in the style of a beloved clinical teacher students actually look forward to seeing. ` +
      `You are mentoring a student enrolled in "${p.name}" at ${p.uni} (${p.note}), currently on the subject "${subject}"${topic ? ', specifically the topic "'+topic+'"' : ''}. ` +
      `Talk like a real professor having office hours with a student you know well, not like a search engine: address them directly, react to what they say, and treat this as an ongoing conversation rather than a one-off lookup. ` +
      `Explain clearly and at the right depth for their exam level, using precise medical terminology, short spoken-friendly paragraphs (this may be read aloud), and clinical or mnemonic analogies where useful. ` +
      `Teach the way a good mentor does: after explaining a concept, occasionally check understanding with a short follow-up question or a "does that make sense so far?" rather than just dumping information and stopping — but don't force this every single turn if it would feel repetitive. ` +
      `Answer in the same language the student writes in (French, English, or Arabic). Keep answers focused and exam-relevant, not exhaustive textbook dumps. This is for exam preparation and mentorship only — never give real-patient clinical advice.`;
    const msgs = explainHistory.map(m=>({role:m.role, content:m.content}));

      typing.remove(); explainHistory.push({role:'assistant', content: answer}); renderChatLog();
    }catch(e){
      typing.remove();
      explainHistory.push({role:'assistant', content: e.message==='NO_KEY' ? noKeyMessage() : 'Sorry — I could not reach the tutor service: '+e.message});
      renderChatLog();
    }
  }

  subjSel.onchange = fillTopics; if(p.subjects.length) fillTopics();

    const system = `You are Professor J generating an exam-style multiple choice quiz for a student in "${p.name}" at ${p.uni}. ` +
      `Create 5 questions on the topic "${topic}" within the subject "${subject}", at the difficulty expected for their exams. ` +
      `Respond ONLY with a raw JSON array, no markdown fences, no preamble. Each item: {"question":"...","options":["A","B","C","D"],"correctIndex":0,"explanation":"short explanation"}.`;
    try{
      const raw = await callClaude(system, [{role:'user', content:'Generate the quiz now.'}]);
      const qs = JSON.parse(stripJsonFences(raw));
      state.quiz = qs; state.quizIndex = 0; state.quizScore = 0; state.quizMeta = { subject, topic };
      showQuizQuestion(area, p);
    }catch(e){ area.innerHTML = `<div class="empty-note">${e.message==='NO_KEY' ? noKeyMessage() : 'Could not generate the quiz. Please try again.'}</div>`; }
  };
}
function showQuizQuestion(area, p){
  const q = state.quiz[state.quizIndex];
  if(!q){
    area.innerHTML = `<div class="quiz-card"><div class="qtext">Quiz complete — score: ${state.quizScore} / ${state.quiz.length}</div></div>`;
    recordProgress(p, state.quizMeta.subject, state.quizMeta.topic, state.quizScore, state.quiz.length);
    return;
  }
  area.innerHTML = `<div class="quiz-card"><div class="qn">Question ${state.quizIndex+1} / ${state.quiz.length}</div>
    <div class="qtext">${q.question}</div><div id="qzOpts"></div><div id="qzExplain"></div></div>`;
  const optsDiv = document.getElementById('qzOpts');
  q.options.forEach((opt,i)=>{
    const b = document.createElement('button'); b.className='opt'; b.textContent=opt;
    b.onclick = ()=>{
      Array.from(optsDiv.children).forEach((c,ci)=>{ c.onclick=null; if(ci===q.correctIndex) c.classList.add('correct'); else if(ci===i) c.classList.add('wrong'); });
      if(i===q.correctIndex) state.quizScore++;
      document.getElementById('qzExplain').innerHTML = `<div class="explain-box">${q.explanation||''}</div><button class="btn" id="qzNext" style="margin-top:12px;">Next</button>`;
      document.getElementById('qzNext').onclick = ()=>{ state.quizIndex++; showQuizQuestion(area, p); };
    };
    optsDiv.appendChild(b);
  });
}
function recordProgress(p, subject, topic, score, total){
  const key = 'progress:' + p.id; const prog = getStore(key, {});
  if(!prog[subject]) prog[subject] = {};
  if(!prog[subject][topic]) prog[subject][topic] = {attempts:0, correct:0, total:0};
  prog[subject][topic].attempts += 1; prog[subject][topic].correct += score; prog[subject][topic].total += total;
  setStore(key, prog);
}

/* ---------------- PROGRESS TAB ---------------- */
function renderProgress(main, p){
  const key = 'progress:' + p.id; const prog = getStore(key, {});
  main.innerHTML = `<h2 class="section-title">Progress <span class="stamp">Tracker</span></h2><div id="progArea"></div>`;
  const area = document.getElementById('progArea');
  const subjects = Object.keys(prog);
  if(!subjects.length){ area.innerHTML = '<div class="empty-note">No quiz attempts yet. Take a quiz to start tracking progress.</div>'; return; }
  let html = ''; const weak = [];
  subjects.forEach(subj=>{
    const topics = prog[subj]; let subjCorrect=0, subjTotal=0;
    Object.keys(topics).forEach(t=>{ subjCorrect+=topics[t].correct; subjTotal+=topics[t].total;
      const pct = topics[t].total ? Math.round(100*topics[t].correct/topics[t].total) : 0;
      if(pct < 60 && topics[t].attempts >= 1) weak.push({subj, topic:t, pct}); });
    const pct = subjTotal ? Math.round(100*subjCorrect/subjTotal) : 0;
    const color = pct>=80?'var(--good)':pct>=50?'var(--mid)':'var(--bad)';
    html += `<div class="prog-subject"><div class="plabel"><b>${subj}</b><span>${pct}%</span></div><div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${color};"></div></div></div>`;
  });
  if(weak.length){
    html += '<h2 class="section-title" style="font-size:15px;margin-top:20px;">Weak topics to revisit</h2>';
    weak.sort((a,b)=>a.pct-b.pct).forEach(w=>{ html += `<div class="weak-item"><span>${w.topic} <span style="color:var(--muted)">(${w.subj})</span></span><span class="pct">${w.pct}%</span></div>`; });
  }
  area.innerHTML = html;
}

  const list = document.getElementById('subjList');
  p.subjects.forEach((s, si)=>{
    const div = document.createElement('div'); div.className='manage-item';
    div.innerHTML = `<div style="display:flex;justify-content:space-between;"><b>${s.name}</b><span class="del" data-si="${si}">remove</span></div>
      <div style="margin-top:8px;">${s.topics.map(t=>`<span class="topic-chip">${t}</span>`).join('')}</div>
      <button class="btn secondary" data-add="${si}" style="margin-top:10px;padding:8px;font-size:12px;">+ Add topic</button>`;
    list.appendChild(div);
  });
  list.querySelectorAll('.del').forEach(el=>{ el.onclick = ()=>{ p.subjects.splice(parseInt(el.dataset.si),1); setStore('profiles', state.profiles); renderManage(main, p); }; });
  list.querySelectorAll('[data-add]').forEach(el=>{ el.onclick = ()=>{ const t = prompt('New topic name:'); if(!t) return; p.subjects[parseInt(el.dataset.add)].topics.push(t); setStore('profiles', state.profiles); renderManage(main, p); }; });
  document.getElementById('addSubjBtn').onclick = ()=>{ const name = prompt('New subject name:'); if(!name) return; p.subjects.push({name, topics:[]}); setStore('profiles', state.profiles); renderManage(main, p); };
}

init();
</script>
</body>
</html>
